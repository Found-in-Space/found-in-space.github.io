<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build a small star app</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040b;
      color: #f6f1e8;
      font-family: system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      left: 12px;
      top: 12px;
      width: min(22rem, calc(100% - 24px));
      padding: 12px;
      border: 1px solid rgba(242, 200, 121, 0.24);
      border-radius: 6px;
      background: rgba(2, 4, 11, 0.78);
      color: #d8deea;
      font-size: 13px;
    }

    .hud strong {
      color: #f2c879;
    }
  </style>
</head>
<body>
  <canvas id="slice" aria-label="2D star slice"></canvas>
  <div class="hud" aria-live="polite">
    <strong>2D slice demo</strong>
    <div id="status">Loading a small star stream...</div>
  </div>

  <script type="module">
    const SKYKIT_VERSION = '0.2.0-alpha.0';
    const SKYKIT_BROWSER_ESM_BASE = 'https://esm.sh/';
    const esmBase = normalizeBaseUrl(
      new URLSearchParams(window.location.search).get('skykitEsmBase')
      || window.__SKYKIT_ESM_BASE_OVERRIDE__
      || SKYKIT_BROWSER_ESM_BASE,
    );

    const [
      octreeProvider,
      starTrees,
    ] = await Promise.all([
      import(packageUrl(`@found-in-space/star-octree-provider@${SKYKIT_VERSION}`)),
      import(packageUrl(`@found-in-space/star-trees@${SKYKIT_VERSION}`)),
    ]);

    const {
      OCTREE_DEFAULT,
      createStarOctreeProviderService,
    } = octreeProvider;
    const {
      createObserverShellStrategy,
      decodeTemperatureK,
      temperatureToRgb,
    } = starTrees;

    const canvas = document.querySelector('#slice');
    const context = canvas.getContext('2d');
    const status = document.querySelector('#status');
    const provider = createStarOctreeProviderService({ url: OCTREE_DEFAULT });
    const cells = [];
    let rows = [];
    let disposed = false;

    window.addEventListener('resize', draw);
    window.addEventListener('pagehide', cleanup, { once: true });
    window.addEventListener('beforeunload', cleanup, { once: true });

    main().catch((error) => {
      status.textContent = error?.message || String(error);
    });

    async function main() {
      const stream = provider.streamCells({
        strategy: createObserverShellStrategy(),
        view: {
          observerPc: { x: 0, y: 0, z: 0 },
          limitingMagnitude: 6.5,
        },
        attributes: ['position', 'magAbs', 'teffLog8', 'objectRef'],
      });

      for await (const delta of stream) {
        if (disposed) break;
        if (delta.type === 'stars/cells-upsert') {
          cells.push(...delta.cells);
          rows = projectSlice(cells, { radiusPc: 50, halfThicknessPc: 10 }).slice(0, 2200);
          draw();
          status.textContent = `${rows.length.toLocaleString()} projected stars from ${cells.length.toLocaleString()} streamed cells.`;
        }
        if (delta.type === 'stars/error') {
          throw new Error(delta.error?.message || 'Provider stream failed.');
        }
        if (delta.type === 'stars/current') {
          status.textContent = `Current slice: ${rows.length.toLocaleString()} stars. This is app-owned rendering, not a Three.js viewer.`;
          break;
        }
      }
    }

    function projectSlice(sourceCells, options) {
      const projected = [];
      for (const cell of sourceCells) {
        const positions = cell.coordinates.components;
        const magnitudes = cell.attributes.magAbs;
        for (let index = 0; index < cell.count; index += 1) {
          const x = positions[index * 3];
          const y = positions[index * 3 + 1];
          const z = positions[index * 3 + 2];
          const radialPc = Math.hypot(x, y);
          if (radialPc > options.radiusPc || Math.abs(z) > options.halfThicknessPc) continue;
          const magAbs = magnitudes?.[index] ?? 8;
          const teffLog8 = cell.attributes.teffLog8?.[index] ?? null;
          const temperatureK = teffLog8 == null ? null : decodeTemperatureK(teffLog8);
          projected.push({ x, y, z, magAbs, teffLog8, temperatureK });
        }
      }
      return projected.sort((left, right) => left.magAbs - right.magAbs);
    }

    function draw() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, canvas.clientWidth || window.innerWidth || 1);
      const height = Math.max(1, canvas.clientHeight || window.innerHeight || 1);
      canvas.width = Math.floor(width * pixelRatio);
      canvas.height = Math.floor(height * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.clearRect(0, 0, width, height);
      context.fillStyle = '#02040b';
      context.fillRect(0, 0, width, height);

      const radiusPc = 50;
      const scale = Math.min(width, height) * 0.46 / radiusPc;
      context.translate(width / 2, height / 2);

      context.strokeStyle = 'rgba(242, 200, 121, 0.28)';
      context.lineWidth = 1;
      context.beginPath();
      context.arc(0, 0, radiusPc * scale, 0, Math.PI * 2);
      context.stroke();

      for (const row of rows) {
        const brightness = Math.max(0.12, Math.min(1, (8 - row.magAbs) / 10));
        const color = row.teffLog8 == null ? '216,226,255' : rgbCss(temperatureToRgb(row.teffLog8));
        context.fillStyle = `rgba(${color}, ${0.25 + brightness * 0.7})`;
        context.beginPath();
        context.arc(row.x * scale, row.y * scale, 0.6 + brightness * 2.2, 0, Math.PI * 2);
        context.fill();
      }

      context.fillStyle = '#f2c879';
      context.beginPath();
      context.moveTo(14, 0);
      context.lineTo(-9, -7);
      context.lineTo(-5, 0);
      context.lineTo(-9, 7);
      context.closePath();
      context.fill();
    }

    function rgbCss(rgb) {
      return `${rgb[0]}, ${rgb[1]}, ${rgb[2]}`;
    }

    function cleanup() {
      if (disposed) return;
      disposed = true;
      window.removeEventListener('resize', draw);
      provider.dispose?.();
    }

    function packageUrl(specifier) {
      return `${esmBase}${specifier}`;
    }

    function normalizeBaseUrl(value) {
      return value.endsWith('/') ? value : `${value}/`;
    }
  </script>
</body>
</html>
