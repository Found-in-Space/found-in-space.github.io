<div id="viewer" style="width:100%;height:560px;background:#02040b"></div>

<form style="position:fixed;top:12px;left:12px;background:#02040bcc;color:white;padding:12px">
  <label>
    <input id="toggle-marker" type="checkbox" checked>
    Show Hyades marker
  </label>
</form>

<script type="module">
  import * as THREE from "__SKYKIT_BROWSER_ESM_BASE__three@__THREE_VERSION__";
  import { createSkykitBrowser } from "__SKYKIT_BROWSER_ESM_BASE__@found-in-space/skykit@__SKYKIT_LIVE_VERSION__/browser?bundle&deps=three@__THREE_VERSION__";

  const HYADES_CENTER_PC = { x: 17.574, y: 42.316, z: 13.963 };

  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.008, 32, 16),
    new THREE.MeshBasicMaterial({
      color: 0x73d5ff,
      wireframe: true,
      transparent: true,
      opacity: 0.8,
    }),
  );
  const browser = await createSkykitBrowser({
    host: "#viewer",
    limitingMagnitude: 7,
    view: { lookAt: { targetPc: HYADES_CENTER_PC } },
    plugins: [
      (context) => context.addPart({
        update(frame) {
          marker.scale.setScalar(1 + Math.sin(frame.elapsedSeconds * 2) * 0.08);
        },
      }),
    ],
  });

  browser.addObject(marker, {
    id: "hyades-marker",
    positionPc: HYADES_CENTER_PC,
    disposeObject: true,
  });

  document.querySelector("#toggle-marker").addEventListener("change", (event) => {
    marker.visible = event.target.checked;
  });
</script>
