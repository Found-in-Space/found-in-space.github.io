<div id="viewer" style="width:100%;height:560px;background:#02040b"></div>

<form style="position:fixed;top:12px;left:12px;background:#02040bcc;color:white;padding:12px">
  <label>
    <input id="toggle-marker" type="checkbox" checked>
    Show Hyades marker
  </label>
</form>

<script type="module">
  import * as THREE from "https://esm.sh/three@0.170.0";
  import { createSkykitBrowser } from "https://esm.sh/@found-in-space/skykit@0.2.0-alpha.1/browser?bundle&deps=three@0.170.0";
  import { createObject3dPlugin } from "https://esm.sh/@found-in-space/skykit@0.2.0-alpha.1?bundle&deps=three@0.170.0";

  const HYADES_CENTER_PC = { x: 17.574, y: 42.316, z: 13.963 };

  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.008, 32, 16),
    new THREE.MeshBasicMaterial({
      color: 0x73d5ff,
      wireframe: true,
      transparent: true,
      opacity: 0.8,
    }),
  );
  marker.position.set(
    HYADES_CENTER_PC.x * 0.001,
    HYADES_CENTER_PC.y * 0.001,
    HYADES_CENTER_PC.z * 0.001,
  );

  await createSkykitBrowser({
    host: "#viewer",
    limitingMagnitude: 7,
    plugins: [
      createObject3dPlugin({
        id: "hyades-marker",
        object3d: marker,
        anchorMode: "world-space",
        disposeObject: true,
      }),
      (context) => context.addPart({
        update(frame) {
          marker.scale.setScalar(1 + Math.sin(frame.elapsedSeconds * 2) * 0.08);
        },
      }),
    ],
  });

  document.querySelector("#toggle-marker").addEventListener("change", (event) => {
    marker.visible = event.target.checked;
  });
</script>
